# Glaze — production web server.
#
# Serves the React build from disk and reverse-proxies everything that belongs
# to Django, so the SPA and the API share ONE origin. That is not just tidy:
# it is what makes VITE_API_URL=/api/v1 work, removes CORS from the picture,
# and lets the auth cookies stay SameSite=Lax instead of the SameSite=None
# that a cross-site setup would force.
#
# ⚠ THE CANONICAL HOST IS www. It is hardcoded in client/index.html (canonical,
# og:url and every JSON-LD @id) and is the default of SITE_ORIGIN in
# client/src/components/common/SEO/siteOrigin.js. To move to the apex you must
# change all three of those, SITE_URL in .env, and this file — together.
# Two hostnames serving the same pages is one page indexed twice, competing
# with itself.
#
# To change domain: replace glazewindowsystems.com throughout, and reissue the
# certificate (docs/DEPLOYMENT.md step 7).

# ── HTTP: challenges and redirect ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name glazewindowsystems.com www.glazewindowsystems.com;

    server_tokens off;

    # Must stay reachable over plain HTTP forever — this is how renewal works.
    # Redirecting it to HTTPS breaks certbot every 60 days, quietly, and the
    # first symptom is an expired certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://www.glazewindowsystems.com$request_uri;
    }
}

# ── HTTPS: apex → www ──────────────────────────────────────────────────
# A separate server block rather than a rewrite inside the main one, because
# the redirect has to happen over TLS: a browser that has seen the HSTS header
# will refuse to make the plain-HTTP request at all.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name glazewindowsystems.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/glazewindowsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glazewindowsystems.com/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://www.glazewindowsystems.com$request_uri;
}

# ── HTTPS: the site ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.glazewindowsystems.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/glazewindowsystems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glazewindowsystems.com/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0/1.1 are deprecated and their only remaining
    # audience is a scanner reporting them as a finding.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # MAX_UPLOAD_SIZE_BYTES is 5 MB. This is the outer limit; leaving it at
    # nginx's 1 MB default would reject a 3 MB blog hero with a bare 413 that
    # never reaches Django's own, friendlier check.
    client_max_body_size 10m;

    # ── Compression ────────────────────────────────────────────────────
    # Text only. The videos and WebP frames are already compressed; gzipping
    # them burns CPU to make them very slightly larger.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/ld+json application/manifest+json
        image/svg+xml font/ttf font/otf;

    # ── Django upstream ────────────────────────────────────────────────
    # Resolved at REQUEST time through Docker's embedded DNS, not at startup.
    # With a plain `proxy_pass http://api:8000` nginx resolves the name once
    # when it loads its config and REFUSES TO START if the api container is
    # not up yet — so a crashed backend takes the whole site down instead of
    # producing a 502. This way nginx stays up and serves the static site even
    # while Django is restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Crawler files ──────────────────────────────────────────────────
    # ⚠ THIS BLOCK MUST COME BEFORE THE SPA FALLBACK, and it does: regex
    # locations are matched ahead of prefix ones. Without it `try_files`
    # answers /robots.txt with index.html — a 200 response containing HTML —
    # and the crawler discards the file entirely rather than reporting an
    # error. The same silent failure applies to sitemap.xml.
    #
    # These are generated by Django from the live database (server/glaze/seo/),
    # so a system published in the Studio appears in the sitemap without a
    # deploy.
    location ~ ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    # Django's own admin. It lives here rather than at /admin/ precisely so
    # this shared origin is possible — /admin/ is the React Studio, served by
    # the SPA fallback below.
    location /django-admin/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    # ── Files Django owns ──────────────────────────────────────────────
    # ^~ on both: without it the asset regex further down wins over a prefix
    # match, and every uploaded .jpg would be looked for in the SPA build
    # instead of the media volume.

    # collectstatic output — the /django-admin/ stylesheets. Not the SPA.
    location ^~ /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Uploads: blog images, catalogue media. Served straight from the volume —
    # routing them through Django would tie up a gunicorn worker per image.
    location ^~ /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;

        # Note: uploads are served from the site's own origin, so an SVG that
        # got past Django's upload validation would run its script here. The
        # validation is in the API (MAX_UPLOAD_SIZE_BYTES plus Pillow's format
        # check on ImageField), and uploads are staff-only. Moving media to a
        # separate origin is the stronger fix if that ever stops being true.
    }

    # ── The SPA build ──────────────────────────────────────────────────

    # Content-hashed by Vite, so the name changes whenever the bytes do.
    # immutable tells the browser not to even revalidate.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Everything in client/public: videos, hero frame sequences, product
    # imagery, logos. Long-lived but NOT immutable — these paths are stable,
    # so a replaced video keeps its name and must be revalidatable.
    location ~* \.(?:mp4|webm|mov|webp|avif|jpe?g|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ⚠ index.html must NOT be cached. It is the file that names the hashed
    # asset bundles; a cached copy points at bundles a deploy has already
    # deleted, and returning visitors get a blank page until they hard-refresh.
    # This is the single most common "the deploy worked but the site is
    # broken" cause on a hashed-asset SPA.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing. Every unmatched path returns index.html and React
    # Router decides — including /about, /systems, /products/<slug> and
    # /admin, none of which exist as files on disk.
    #
    # The 404 status is React's job (App.jsx renders NotFound), which is why
    # this serves 200. A crawler still sees the noindex that page sets.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
