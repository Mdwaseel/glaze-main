# TLS BOOTSTRAP CONFIGURATION — port 80 only, used exactly once.
#
# The chicken-and-egg: app.conf listens on 443 and cannot start without a
# certificate, and Let's Encrypt will not issue a certificate until it can
# fetch a challenge file over plain HTTP from this domain. nginx exits on a
# missing ssl_certificate, so there is no way to serve the challenge from the
# real config.
#
# So the first boot runs this, the certificate is issued, and NGINX_CONF in
# .env switches to app.conf permanently. See docs/DEPLOYMENT.md step 7.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Where certbot writes its challenge files. The webroot is a volume shared
    # with the certbot container, which is why certbot never needs to stop
    # nginx to renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Deliberately NOT the site. Serving the real thing over plain HTTP would
    # let a crawler reach it — and index http:// URLs — during the minutes
    # before the certificate exists.
    location / {
        return 503 "Glaze: awaiting TLS certificate.\n";
        add_header Content-Type text/plain;
    }
}
