server {
    listen 80;
    listen [::]:80;

    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/ld+json application/manifest+json
        image/svg+xml font/ttf font/otf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    location /django-admin/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api$request_uri;
    }

    location ^~ /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location ~* \.(?:mp4|webm|mov|webp|avif|jpe?g|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
