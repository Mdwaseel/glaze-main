# Headers every proxied location sends to Django.
#
# Included rather than repeated so the four security-relevant lines below
# cannot drift between /api/, /django-admin/ and the crawler files.

proxy_http_version 1.1;

# Django needs the PUBLIC host, not the container name. ALLOWED_HOSTS is
# checked against this, and get_host() feeds any absolute URL Django builds.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# ⚠ $remote_addr, NOT $proxy_add_x_forwarded_for. This is a security control,
# not a formality.
#
# ADMIN_TRUST_FORWARDED_FOR is on in production, and account/security.py takes
# the LEFT-MOST entry of X-Forwarded-For as the client address — correct when
# a trusted proxy writes the header, wrong when anything else can.
# $proxy_add_x_forwarded_for APPENDS to whatever the client sent, so a request
# carrying `X-Forwarded-For: 1.2.3.4` would arrive as `1.2.3.4, <real ip>` and
# Django would read the attacker's invented address. They could then forge a
# fresh one per attempt and walk straight past the per-IP login lockout.
# Overwriting discards the client's claim, which is the whole point of
# terminating at a proxy you control.
proxy_set_header X-Forwarded-For   $remote_addr;

# SECURE_PROXY_SSL_HEADER in settings.py reads this to know the original
# request was HTTPS. Without it Django sees plain http, SECURE_SSL_REDIRECT
# fires, and every request becomes an infinite redirect loop.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_redirect off;

# Above EMAIL_TIMEOUT (15s) and CHAT_TIMEOUT_SECONDS (15s), so nginx never
# cuts off a request Django is still legitimately waiting on.
proxy_connect_timeout 5s;
proxy_send_timeout    65s;
proxy_read_timeout    65s;

# Django sets these itself on its own responses. nginx re-adds them at server
# level for everything it serves, so without hiding them here every API
# response would carry each header twice.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
