# ⚠ nginx's add_header does NOT merge across levels. A location that declares
# any add_header of its own DISCARDS every add_header inherited from the
# server block. That is why this snippet is included again inside each
# location that sets its own Cache-Control — leaving it out there would
# silently drop the security headers on exactly the assets most widely
# cached, and nothing would warn you.

# One year, subdomains included, preload-eligible. Matches SECURE_HSTS_* in
# settings.py so nginx-served and Django-served responses agree.
#
# ⚠ includeSubDomains commits EVERY subdomain of this domain to HTTPS for a
# year, in browsers that have already seen this header — including ones that
# do not exist yet. Do not submit to the preload list until that is intended;
# it is slow to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Stops a browser from second-guessing a Content-Type — the mechanism behind
# "uploaded .txt gets executed as JavaScript".
add_header X-Content-Type-Options "nosniff" always;

# Matches SECURE_REFERRER_POLICY. Full URLs are sent to this origin only;
# third parties get nothing.
add_header Referrer-Policy "same-origin" always;

# Matches X_FRAME_OPTIONS = 'DENY'. No embedding, anywhere — clickjacking
# cover for the Studio login in particular.
add_header X-Frame-Options "DENY" always;
